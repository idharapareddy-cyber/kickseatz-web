name: Rebalance NBA homepage

on:
  push:
    branches: ["main"]

jobs:
  rebalance:
    if: ${{ !contains(github.event.head_commit.message, 'NBA homepage rebalance complete') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace repetitive NFL homepage sections with NBA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/page.tsx')
          s = p.read_text()

          s = re.sub(r'\n      <section className="kz-section kz-nba-home-section">.*?</section>\n', '\n', s, count=1, flags=re.S)

          nba_week = '''
      <section className="kz-section kz-nba-home-section">
        <div className="kz-section-heading"><div><span className="kz-eyebrow">NBA · THIS WEEK</span><h2>NBA matchups to watch</h2></div><Link href="/nba">See all NBA games <ArrowRight size={15} /></Link></div>
        <div className="kz-nba-home-grid">{NBA_HOME_GAMES.slice(0, 3).map((game) => <NbaHomeCard key={game.id} game={game} />)}</div>
      </section>
'''

          nba_trending = '''
      <section className="kz-section kz-nba-trending-section">
        <div className="kz-section-heading"><div><span className="kz-eyebrow">NBA · TRENDING</span><h2>Games basketball fans are watching</h2></div><Link href="/nba">Browse NBA <ArrowRight size={15} /></Link></div>
        <div className="kz-nba-home-grid">{NBA_HOME_GAMES.slice(3, 6).map((game) => <NbaHomeCard key={game.id} game={game} />)}</div>
      </section>
'''

          s, n = re.subn(r'\n      <section className="kz-section kz-game-type-section">.*?</section>\n', nba_week, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find NFL game-type section')

          s, n = re.subn(r'\n      <section className="kz-section"><div className="kz-section-heading"><div><span className="kz-eyebrow">TRENDING NOW · NFL</span><h2>Games people are watching</h2></div><Link href="/find-tickets">Browse all <ArrowRight size={15} /></Link></div><div className="kz-card-grid">\{trending\.slice\(0, 3\)\.map\(\(game\) => <EventCard key=\{game\.id\} game=\{game\} />\)\}</div></section>\n', nba_trending, s, count=1)
          if n != 1:
              raise SystemExit('Could not find NFL trending section')

          p.write_text(s)

          css = Path('app/kz-final-audit.css')
          c = css.read_text()
          marker = '/* NBA homepage rebalance: use the same compact card proportions as the established event cards. */'
          if marker not in c:
              c += '''\n\n/* NBA homepage rebalance: use the same compact card proportions as the established event cards. */\n.kz-home .kz-nba-home-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px!important;}\n.kz-home .kz-nba-home-card{display:flex!important;flex-direction:column!important;min-width:0!important;overflow:hidden!important;border-radius:16px!important;}\n.kz-home .kz-nba-home-art{height:160px!important;min-height:160px!important;flex:none!important;position:relative!important;}\n.kz-home .kz-nba-home-info{min-height:78px!important;padding:12px 14px!important;}\n.kz-home .kz-nba-home-team img{width:54px!important;height:54px!important;object-fit:contain!important;}\n@media(max-width:1050px){.kz-home .kz-nba-home-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}}\n@media(max-width:720px){.kz-home .kz-nba-home-grid{grid-template-columns:1fr!important;}.kz-home .kz-nba-home-art{height:150px!important;min-height:150px!important;}}\n'''
              css.write_text(c)
          PY

      - name: Remove one-off workflow and commit
        run: |
          rm -f .github/workflows/rebalance-nba-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/kz-final-audit.css .github/workflows/rebalance-nba-home.yml
          git commit -m "NBA homepage rebalance complete"
          git push
