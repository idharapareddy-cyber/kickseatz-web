name: Integrate NBA homepage once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'Add NBA homepage integration' && github.event.head_commit.message != 'Integrate NBA homepage' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch homepage
        run: node scripts/patch-nba-home.mjs
      - name: Commit homepage integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate NBA homepage"
          git push origin main
