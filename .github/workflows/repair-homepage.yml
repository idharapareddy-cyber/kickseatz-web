name: Repair homepage balance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, 'Load controlled homepage rebalance styling') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply homepage repair
        run: node scripts/patch-nba-home.mjs
      - name: Commit homepage repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Repair homepage NBA and hero balance"
          git push origin main
