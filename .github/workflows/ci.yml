name: KickSeatz CI

on:
  push:
    branches: ["main", "audit/phase1-polish"]
  pull_request:
    branches: ["main"]

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
